<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カミナレ — Music Video</title>
<meta name="description" content="カミナレ（神鳴れ）— a real-time music video. WebGL, ink, stained glass and thunder.">
<meta name="theme-color" content="#0b0a0c">
<style>
  :root {
    --ink: #0e0c0b; --paper: #ede4d3; --shu: #e3402a; --gold: #d8b25a; --gold2: #f2d58a;
    --dim: rgba(237, 228, 211, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050405; color: var(--paper); overflow: hidden; }
  body { display: grid; place-items: center; font-family: KMono, ui-monospace, Menlo, monospace; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; background: #000; overflow: hidden; container-type: inline-size;
            width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
  #gl { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- boot / title card ---------- */
  #boot { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
          background: radial-gradient(120% 90% at 50% 40%, rgba(40,20,14,.25), rgba(0,0,0,.82) 70%); transition: opacity 1.1s ease, visibility 1.1s; z-index: 5; }
  #boot.gone { opacity: 0; visibility: hidden; }
  .b-left { justify-self: end; padding-right: 4.5cqw; text-align: right; }
  .b-right { justify-self: start; padding-left: 4.5cqw; }
  .b-title { writing-mode: vertical-rl; font-family: KBrush, serif; font-size: 11.5cqw; line-height: 1; letter-spacing: .02em;
             color: var(--paper); text-shadow: 0 0 2.2cqw rgba(227, 64, 42, .35); position: relative; }
  .b-title ruby rt { font-family: KMincho, serif; font-size: 1.15cqw; letter-spacing: .6em; color: var(--gold); }
  .b-black { font-family: KBlack, serif; font-size: 3.2cqw; color: var(--gold2); letter-spacing: .04em; margin: 0 0 .9cqw; }
  .b-sub { font-size: .82cqw; letter-spacing: .32em; color: var(--dim); line-height: 2.1; text-transform: uppercase; }
  .b-sub b { color: var(--paper); font-weight: 400; }
  #play { appearance: none; border: 0; cursor: pointer; margin-top: 2.2cqw; width: 8.2cqw; height: 8.2cqw; border-radius: 50%;
          background: var(--shu); color: var(--paper); display: grid; place-items: center; position: relative;
          box-shadow: 0 0 0 .18cqw rgba(227,64,42,.35), 0 0 4cqw rgba(227,64,42,.35); transition: transform .35s cubic-bezier(.2,1.4,.4,1), box-shadow .3s; }
  #play:hover { transform: scale(1.06) rotate(-4deg); box-shadow: 0 0 0 .5cqw rgba(227,64,42,.25), 0 0 6cqw rgba(227,64,42,.55); }
  #play:disabled { filter: grayscale(.7) brightness(.6); cursor: progress; }
  #play span { font-family: KMincho, serif; font-size: 2.3cqw; line-height: 1; writing-mode: vertical-rl; letter-spacing: .1em; }
  #play::after { content: ""; position: absolute; inset: -.9cqw; border-radius: 50%; border: 1px dashed rgba(216,178,90,.6); animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .b-load { margin-top: 1.6cqw; width: 14cqw; height: 1px; background: rgba(237,228,211,.15); position: relative; }
  .b-load i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--gold); transition: width .25s; }
  .b-msg { margin-top: .7cqw; font-size: .7cqw; letter-spacing: .25em; color: var(--dim); min-height: 1em; }
  .b-hint { position: absolute; bottom: 2.4cqw; left: 0; right: 0; text-align: center; font-size: .72cqw; letter-spacing: .3em; color: rgba(237,228,211,.38); }
  .b-hint kbd { font-family: inherit; border: 1px solid rgba(237,228,211,.25); padding: .1em .45em; border-radius: 2px; margin: 0 .2em; }

  /* ---------- player controls ---------- */
  #ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.4cqw 2.2cqw 1.2cqw; z-index: 4;
        background: linear-gradient(transparent, rgba(0,0,0,.55)); opacity: 0; transition: opacity .45s; }
  #ui.show { opacity: 1; }
  #bar { position: relative; height: 1.4cqw; cursor: pointer; }
  #bar .track { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(237,228,211,.18); }
  #bar .fill { position: absolute; left: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--shu); width: 0; }
  #bar .tick { position: absolute; top: 50%; width: 1px; height: .9cqw; margin-top: -.45cqw; background: rgba(237,228,211,.35); }
  #bar .tick b { position: absolute; bottom: 1.1cqw; left: 50%; transform: translateX(-50%); font-family: KMincho, serif; font-weight: 400; font-size: .78cqw;
                 color: rgba(237,228,211,.6); white-space: nowrap; opacity: 0; transition: opacity .2s; }
  #bar:hover .tick b { opacity: 1; }
  #bar .head { position: absolute; top: 50%; width: .7cqw; height: .7cqw; margin: -.35cqw 0 0 -.35cqw; border-radius: 50%; background: var(--paper); left: 0; }
  .row { display: flex; align-items: center; gap: 1.4cqw; margin-top: .5cqw; font-size: .8cqw; letter-spacing: .14em; color: var(--dim); }
  .row button { appearance: none; background: none; border: 0; color: var(--paper); cursor: pointer; font: inherit; letter-spacing: .14em; padding: .2cqw 0; opacity: .8; }
  .row button:hover { opacity: 1; color: var(--gold2); }
  .row .sp { flex: 1; }
  #fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 4cqw; font-size: 1.1cqw; line-height: 2; color: var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <div id="boot">
    <div class="b-left">
      <p class="b-black">Kaminare</p>
      <div class="b-sub">a real-time music video<br><b>172</b> bpm · <b>3:01</b><br>webgl / ink / glass / thunder</div>
    </div>
    <div class="b-title"><ruby>カミナレ<rt>神鳴れ</rt></ruby></div>
    <div class="b-right">
      <button id="play" disabled aria-label="再生 / Play"><span>奉納</span></button>
      <div class="b-load"><i id="loadbar"></i></div>
      <div class="b-msg" id="loadmsg">墨を磨っています…</div>
    </div>
    <div class="b-hint"><kbd>Space</kbd> 再生/停止 <kbd>←</kbd><kbd>→</kbd> 5秒 <kbd>F</kbd> 全画面 <kbd>H</kbd> HUD <kbd>1</kbd>–<kbd>9</kbd> 章</div>
  </div>
  <div id="ui">
    <div id="bar"><div class="track"></div><div class="fill" id="fill"></div><div class="head" id="head"></div></div>
    <div class="row">
      <button id="pp">❚❚ PAUSE</button>
      <span id="tc">00:00 / 03:01</span>
      <span id="chap"></span>
      <span class="sp"></span>
      <button id="hudbtn">HUD</button>
      <button id="qbtn">QUALITY ●●●</button>
      <button id="fsbtn">FULLSCREEN</button>
    </div>
  </div>
  <div id="fallback">この作品の再生には WebGL2 対応ブラウザが必要です。<br>This piece needs a browser with WebGL2 (recent Chrome, Edge, Firefox or Safari).</div>
</div>
<audio id="song" preload="auto">
  <source src="assets/kaminare.m4a" type="audio/mp4">
  <source src="assets/kaminare.mp3" type="audio/mpeg">
</audio>
<script src="assets/fonts.js"></script>
<script src="app.js"></script>
</body>
</html>
